name: Worker preview build
on:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/worker-preview.test.mjs
      - run: node scripts/build-worker-assets.mjs
      - run: npx --yes wrangler@4.151.3 deploy --config wrangler.worker.toml --dry-run --outdir output/worker-bundle
