    - generic [ref=f1e31]:
      - text: CASE 2026-014 — OPENED
      - paragraph [ref=f1e32]: It started with one fake profile — a "surgeon" with stolen photos and a suspicious fondness for gift cards. Pulling that thread unravelled 40+ personas, a shared payment-mule network, and hosting infrastructure that nobody bothered to hide.
      - paragraph [ref=f1e33]:
        - text: Romance scams are usually reported as isolated tragedies. They're not. They are
        - strong [ref=f1e34]: industrial operations
        - text: with shared tooling, recycled scripts, and central infrastructure — which means they can be mapped, and mapped things can be dismantled. This case file documents the full network, from first contact to the registrar that finally acted.
      - heading "§ First Contact" [level=2] [ref=f1e35]
      - paragraph [ref=f1e36]: The profile that opened this case reached out to a victim through a widowers' support group — a hunting ground these crews prefer because grief lowers defences. Within three messages the conversation moved to Telegram. Within ten, the "surgeon" had a customs emergency only an Apple gift card could solve.
      - figure "Exhibit A 40 personas, 6 recycled photo sets" [ref=f1e37]:
        - generic [ref=f1e38]: "[ exhibit image — profile grid ]"
        - generic [ref=f1e39]:
          - generic [ref=f1e40]: Exhibit A
          - generic [ref=f1e41]: 40 personas, 6 recycled photo sets
      - heading "§ Pivoting on Infrastructure" [level=2] [ref=f1e42]
      - paragraph [ref=f1e43]: "Every persona linked back to one of three \"verification\" sites — pages built to make a fake identity look bankable. All three shared a Google Analytics ID. Amateur hour, but useful for us:"
      - generic [ref=f1e44]:
        - generic [ref=f1e45]:
          - generic [ref=f1e46]: evidence log — dns pivot
          - generic [ref=f1e47]: exhibit F
        - generic [ref=f1e48]: "# reverse lookup on shared analytics ID $ threat-hunter pivot --ua UA-84921-XX found: verify-my-love[.]com → 91.234.xx.xx found: military-docs-check[.]net → 91.234.xx.xx found: global-parcel-pay[.]org → 91.234.xx.xx # same /24, same registrar, same week of registration"
      - blockquote [ref=f1e49]:
        - text: "\"He said the money was for a flight home from the oil rig. I sent it because no one had spoken to me like that since my husband died.\""
        - generic [ref=f1e50]: "— Statement, victim #3 (shared with permission)"
