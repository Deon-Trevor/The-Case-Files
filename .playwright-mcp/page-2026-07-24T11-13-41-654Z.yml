      - text: CASE 2026-014 — OPENED
      - paragraph [ref=e23]: It started with one fake profile — a "surgeon" with stolen photos and a suspicious fondness for gift cards. Pulling that thread unravelled 40+ personas, a shared payment-mule network, and hosting infrastructure that nobody bothered to hide.
      - paragraph [ref=e24]:
        - text: Romance scams are usually reported as isolated tragedies. They're not. They are
        - strong [ref=e25]: industrial operations
        - text: with shared tooling, recycled scripts, and central infrastructure — which means they can be mapped, and mapped things can be dismantled. This case file documents the full network, from first contact to the registrar that finally acted.
      - heading "§ First Contact" [level=2] [ref=e26]
      - paragraph [ref=e27]: The profile that opened this case reached out to a victim through a widowers' support group — a hunting ground these crews prefer because grief lowers defences. Within three messages the conversation moved to Telegram. Within ten, the "surgeon" had a customs emergency only an Apple gift card could solve.
      - figure "Exhibit A 40 personas, 6 recycled photo sets" [ref=e28]:
        - generic [ref=e29]: "[ exhibit image — profile grid ]"
        - generic [ref=e30]:
          - generic [ref=e31]: Exhibit A
          - generic [ref=e32]: 40 personas, 6 recycled photo sets
      - heading "§ Pivoting on Infrastructure" [level=2] [ref=e33]
      - paragraph [ref=e34]: "Every persona linked back to one of three \"verification\" sites — pages built to make a fake identity look bankable. All three shared a Google Analytics ID. Amateur hour, but useful for us:"
